<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Profile · Minh Khôi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 3.5rem;
            padding: 2.8rem 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #fd79a8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            box-shadow: 0 12px 24px -8px rgba(108, 92, 231, 0.5), 0 0 60px rgba(108, 92, 231, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.15);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 12px 24px -8px rgba(108, 92, 231, 0.5), 0 0 60px rgba(108, 92, 231, 0.2);
            }
            50% {
                box-shadow: 0 12px 40px -8px rgba(108, 92, 231, 0.8), 0 0 80px rgba(108, 92, 231, 0.4);
            }
        }
        .avatar i {
            font-size: 4.5rem;
            color: white;
        }
        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px rgba(162, 155, 254, 0.3);
        }
        .bio {
            font-size: 1.05rem;
            color: #c8c0e8;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 0.5rem auto 2rem;
        }
        .social {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem 1rem;
            margin: 2.2rem 0 1.2rem;
        }
        .social a {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #e0d8f0;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 120px;
            justify-content: center;
        }
        .social a i {
            font-size: 1.2rem;
        }
        .social a:hover {
            transform: translateY(-3px) scale(1.03);
        }
        .social a:active {
            transform: scale(0.92);
        }
        .yt i {
            color: #ff0000;
        }
        .yt:hover {
            background: #ff0000;
            color: #fff;
            border-color: #ff0000;
        }
        .yt:hover i {
            color: #fff;
        }
        .x i {
            color: #fff;
        }
        .x:hover {
            background: #000;
            color: #fff;
            border-color: #fff;
        }
        .x:hover i {
            color: #fff;
        }
        .ig i {
            color: #e4405f;
        }
        .ig:hover {
            background: #e4405f;
            color: #fff;
            border-color: #e4405f;
        }
        .ig:hover i {
            color: #fff;
        }
        .gh i {
            color: #fff;
        }
        .gh:hover {
            background: #181717;
            color: #fff;
            border-color: #fff;
        }
        .gh:hover i {
            color: #fff;
        }
        .tt i {
            color: #fff;
        }
        .tt:hover {
            background: #010101;
            color: #fff;
            border-color: #fff;
        }
        .tt:hover i {
            color: #fff;
        }
        .footer {
            font-size: 0.8rem;
            color: #6a5a82;
            opacity: 0.5;
            border-top: 1px dashed rgba(162, 155, 254, 0.1);
            padding-top: 1.2rem;
            margin-top: 1.8rem;
        }
        @media (max-width: 550px) {
            .card {
                padding: 1.8rem 1.2rem;
                border-radius: 2.5rem;
            }
            h1 {
                font-size: 2rem;
            }
            .avatar {
                width: 100px;
                height: 100px;
            }
            .avatar i {
                font-size: 3.5rem;
            }
            .social a {
                min-width: 100px;
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
                flex: 1 1 40%;
            }
            .bio {
                font-size: 0.9rem;
                padding: 0.6rem 1.2rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="bg"></canvas>

    <div class="card">
        <div class="avatar">
            <i class="fas fa-user-astronaut"></i>
        </div>
        <h1>Minh Khôi</h1>
        <div class="bio">
            <i class="fas fa-quote-left" style="opacity:0.4;margin-right:6px;"></i>
            Khám phá vũ trụ &amp; kết nối không giới hạn
            <i class="fas fa-quote-right" style="opacity:0.4;margin-left:6px;"></i>
        </div>

        <div class="social">
            <a href="#" class="yt" target="_blank"><i class="fab fa-youtube"></i> YouTube</a>
            <a href="#" class="x" target="_blank"><i class="fab fa-x-twitter"></i> X</a>
            <a href="#" class="ig" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="#" class="gh" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            <a href="#" class="tt" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
        </div>

        <div class="footer">
            <i class="fas fa-link" style="margin-right:6px;"></i>
            Thay link giữ chỗ bằng URL của bạn
        </div>
    </div>

    <script>
        // ===== HIỆU ỨNG VŨ TRỤ =====
        (function() {
            const canvas = document.getElementById('bg');
            const ctx = canvas.getContext('2d');
            let w, h;
            const stars = [];
            const comets = [];

            function resize() {
                w = window.innerWidth;
                h = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.scale(dpr, dpr);
            }

            const isMobile = () => window.innerWidth < 768;
            const starCount = () => isMobile() ? 150 : 250;
            const cometCount = () => isMobile() ? 3 : 5;

            function init() {
                stars.length = 0;
                comets.length = 0;
                for (let i = 0; i < starCount(); i++) {
                    stars.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        r: Math.random() * (isMobile() ? 1.2 : 1.8) + 0.3,
                        b: Math.random() * 0.7 + 0.3,
                        s: Math.random() * 0.025 + 0.005,
                        p: Math.random() * Math.PI * 2,
                        c: Math.random() > 0.7 ? `hsl(${Math.random()*60+200},85%,75%)` : '#fff'
                    });
                }
                for (let i = 0; i < cometCount(); i++) {
                    const a = Math.random() * Math.PI * 2;
                    const sp = Math.random() * (isMobile() ? 1.2 : 2) + 0.8;
                    comets.push({
                        x: Math.random() * w,
                        y: Math.random() * h * 0.2,
                        vx: Math.cos(a) * sp * 0.6,
                        vy: Math.sin(a) * sp * 0.6 + 0.2,
                        l: Math.random() * (isMobile() ? 40 : 60) + 20,
                        r: Math.random() * (isMobile() ? 1.2 : 2) + 0.8,
                        b: Math.random() * 0.6 + 0.4,
                        h: Math.random() * 60 + 200
                    });
                }
            }

            function drawStar(s, t) {
                const tw = 0.5 + 0.5 * Math.sin(t * s.s + s.p);
                const a = s.b * tw;
                const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
                g.addColorStop(0, `rgba(255,255,255,${a*0.8})`);
                g.addColorStop(0.3, `rgba(200,220,255,${a*0.3})`);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                ctx.fillStyle = g;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = s.c || `rgba(255,255,255,${a})`;
                ctx.shadowColor = `rgba(200,220,255,${a*0.3})`;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawComet(c, t) {
                const a = c.b * (0.7 + 0.3 * Math.sin(t * 0.001 + c.x));
                const g = ctx.createRadialGradient(c.x, c.y, 0, c.x - c.vx * 0.5, c.y - c.vy * 0.5, c.l);
                const h = c.h;
                g.addColorStop(0, `hsla(${h},100%,95%,${a*0.9})`);
                g.addColorStop(0.15, `hsla(${h-10},100%,80%,${a*0.6})`);
                g.addColorStop(0.4, `hsla(${h-30},90%,60%,${a*0.3})`);
                g.addColorStop(0.7, `hsla(${h-50},70%,40%,${a*0.1})`);
                g.addColorStop(1, `hsla(${h-70},50%,20%,0)`);
                ctx.beginPath();
                const tx = c.x - c.vx * 0.7;
                const ty = c.y - c.vy * 0.7;
                ctx.moveTo(c.x, c.y);
                ctx.quadraticCurveTo(tx - c.vy * 0.3, ty + c.vx * 0.3, tx - c.vx * 0.3, ty - c.vy * 0.3);
                ctx.quadraticCurveTo(tx + c.vy * 0.3, ty - c.vx * 0.3, c.x, c.y);
                ctx.closePath();
                ctx.fillStyle = g;
                ctx.shadowColor = `hsla(${h},100%,70%,${a*0.4})`;
                ctx.shadowBlur = 30;
                ctx.fill();
                ctx.shadowBlur = 0;
                const hg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 4);
                hg.addColorStop(0, `rgba(255,255,255,${a*0.95})`);
                hg.addColorStop(0.2, `hsla(${h},100%,90%,${a*0.6})`);
                hg.addColorStop(0.5, `hsla(${h},100%,70%,${a*0.2})`);
                hg.addColorStop(1, `hsla(${h},100%,50%,0)`);
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r * 4, 0, Math.PI * 2);
                ctx.fillStyle = hg;
                ctx.shadowColor = `hsla(${h},100%,80%,${a*0.5})`;
                ctx.shadowBlur = 40;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${a*0.95})`;
                ctx.shadowColor = `rgba(255,255,255,${a*0.6})`;
                ctx.shadowBlur = 25;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function updateComet(c) {
                c.x += c.vx;
                c.y += c.vy;
                c.vx += Math.sin(c.y * 0.008) * 0.004;
                c.vy += Math.cos(c.x * 0.008) * 0.004;
                const sp = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
                const maxSp = isMobile() ? 2.5 : 3.5;
                if (sp > maxSp) { c.vx = (c.vx / sp) * maxSp * 0.8;
                    c.vy = (c.vy / sp) * maxSp * 0.8; }
                const m = 100;
                if (c.x < -m || c.x > w + m || c.y < -m || c.y > h + m) {
                    const a = Math.random() * Math.PI * 2;
                    const sp2 = Math.random() * (isMobile() ? 1.2 : 2) + 0.8;
                    c.x = Math.random() * w;
                    c.y = Math.random() * h * 0.2;
                    c.vx = Math.cos(a) * sp2 * 0.6;
                    c.vy = Math.sin(a) * sp2 * 0.6 + 0.2;
                    c.l = Math.random() * (isMobile() ? 40 : 60) + 20;
                    c.r = Math.random() * (isMobile() ? 1.2 : 2) + 0.8;
                    c.b = Math.random() * 0.6 + 0.4;
                    c.h = Math.random() * 60 + 200;
                }
            }

            let id = null,
                last = 0;

            function animate(t) {
                if (t - last < 16) { id = requestAnimationFrame(animate); return; }
                last = t;
                ctx.clearRect(0, 0, w, h);
                for (const s of stars) drawStar(s, t);
                for (const c of comets) { updateComet(c);
                    drawComet(c, t); }
                id = requestAnimationFrame(animate);
            }

            function start() {
                resize();
                init();
                if (id) cancelAnimationFrame(id);
                last = 0;
                animate(0);
            }

            window.addEventListener('resize', () => {
                clearTimeout(window._resizeTO);
                window._resizeTO = setTimeout(() => { resize();
                    init(); }, 200);
            });
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) { if (id) { cancelAnimationFrame(id);
                        id = null; } } else { if (!id) { last = 0;
                        animate(0); } }
            });
            if (document.readyState === 'complete') start();
            else window.addEventListener('load', start);
        })();

        // ===== CẬP NHẬT LINK =====
        document.querySelectorAll('.social a').forEach(el => {
            const t = el.textContent.trim();
            const links = {
                'YouTube': 'https://www.youtube.com/@yourchannel',
                'X': 'https://x.com/yourhandle',
                'Instagram': 'https://www.instagram.com/yourprofile',
                'GitHub': 'https://github.com/yourusername',
                'TikTok': 'https://www.tiktok.com/@yourhandle'
            };
            let p = '';
            if (t.includes('YouTube')) p = 'YouTube';
            else if (t.includes('X')) p = 'X';
            else if (t.includes('Instagram')) p = 'Instagram';
            else if (t.includes('GitHub')) p = 'GitHub';
            else if (t.includes('TikTok')) p = 'TikTok';
            if (p && links[p] && el.href === '#') el.href = links[p];
        });
    </script>

</body>
</html>
